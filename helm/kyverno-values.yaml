# helm/kyverno-values.yaml
# Kyverno Helm values — applied by bootstrap.sh and bootstrap-azure.sh.
#
# Used by both AWS and AKS. Cloud-specific configuration (IRSA annotation,
# workload identity label) is passed as --set flags in the bootstrap scripts
# because those values come from Terraform outputs at runtime.
#
# To update Kyverno config, edit this file and re-run the relevant bootstrap.

# ── Metrics label dimensions: the measurement depends on them (defect D36) ────
#
# Chart 3.8.2 introduced a `metricsExposure` block that chart 3.1.4 did not have,
# and its DEFAULT strips the namespace label from the two families this
# evaluation measures:
#
#   kyverno_admission_review_duration_seconds  disabledLabelDimensions: [resource_namespace]
#   kyverno_policy_execution_duration_seconds  disabledLabelDimensions: [resource_namespace, resource_request_operation]
#
# `measure-admission.sh` selects series with `--filter resource_namespace=
# supply-chain-demo`. With the label gone, that filter matches nothing, and run
# 31890464496 recorded `in_webhook_cost: null` for every condition — the primary
# metric of §0.0.1, the "measured inside Kyverno" figure, silently absent.
#
# ⚠️ THE OBVIOUS FIX IS THE WRONG ONE. Dropping the filter would make the
# numbers reappear, and they would be the aggregate of ALL admission traffic in
# the cluster — including namespaces no policy matches. That is precisely defect
# D1, the namespace error that invalidated the entire original Phase 4. The
# label is not decoration; it is what scopes the measurement to the pods the
# policies actually evaluate.
#
# So the dimensions are re-enabled rather than the filter removed. An empty
# disabledLabelDimensions restores the labels the 3.1.4 results were collected
# with, which is also what makes the two comparable.
metricsConfig:
  metricsExposure:
    kyverno_admission_review_duration_seconds:
      disabledLabelDimensions: []
    kyverno_policy_execution_duration_seconds:
      disabledLabelDimensions: []
    kyverno_admission_requests_total:
      disabledLabelDimensions: []

admissionController:
  replicas: 3

  container:
    # HOME for the credential helpers — see the extraVolumes note below (D31).
    extraEnvVars:
      - name: HOME
        value: /.cache

    # ── The image verification cache (defect D13, reopened) ──────────────────
    #
    # Kyverno v1.18.2 ships an image verification cache that v1.11.4 did not:
    # imageVerifyCacheEnabled=true, maxSize=1000, TTL=1h. It changes what the
    # latency experiment measures — a repeated admission of the same digest
    # skips the Rekor round trip entirely — so cache state is now an explicit,
    # recorded condition of that experiment rather than an ambient default.
    #
    # This file leaves the cache ON, which is the shipped default and what a
    # production cluster runs. scripts/set-verify-cache.sh flips it for the
    # cold-cache arm of the matrix and records which state was measured.
    #
    # ⚠️ THE VALUE MUST BE A QUOTED STRING. The chart renders extraArgs as
    #      {{- range $key, $value := ...extraArgs }}
    #      {{- if $value }}
    #      - --{{ $key }}={{ $value }}
    #    and a YAML boolean false is falsy in Go templates, so
    #    `imageVerifyCacheEnabled: false` renders NOTHING and the flag silently
    #    keeps its default. `"false"` is a non-empty string and renders.
    #    Measured: false -> 0 occurrences, "false" -> 1, 0 -> 0.
    #    This is the fifth silently-ignored-value defect in this project
    #    (D6, D19, D27, D30, and now the chart's own template).
    extraArgs:
      imageVerifyCacheEnabled: "true"
  # serviceAccount annotations and podLabels for IRSA/Workload Identity are
  # set via --set in bootstrap.sh / bootstrap-azure.sh at install time.

  # Three replicas without a disruption budget are three replicas that a node
  # drain can remove at once. That is tolerable while the webhooks are
  # failurePolicy=Ignore — the cost of losing every replica is unverified
  # admissions — but it is not tolerable fail-closed, where the same event stops
  # all pod creation in supply-chain-demo.
  #
  # minAvailable: 2 of 3 permits voluntary disruption of one replica at a time,
  # so a rolling node upgrade proceeds and quorum of the admission service is
  # kept throughout. It does not protect against involuntary loss (node failure,
  # eviction under memory pressure); nothing in a PDB does.
  podDisruptionBudget:
    minAvailable: 2

  # Prometheus metrics on :8000/metrics — the source for the in-webhook cost
  # measurement, which reads kyverno_admission_review_duration_seconds as
  # Δsum/Δcount by port-forwarding svc/kyverno-svc-metrics.
  #
  # This block used to sit at the top level of this file, where the chart has
  # never defined it — in 3.1.4 or 3.8.2 — so Helm ignored it silently and the
  # metrics service existed only because create/port default to true/8000
  # anyway. Same disease as the dead webhook-timeout block removed earlier
  # (defect D6). It is nested under the controller it belongs to now, and
  # verified to render `kyverno-svc-metrics` on both chart versions.
  metricsService:
    create: true
    port: 8000

  # ── A writable HOME for the registry credential helpers (defect D31) ───────
  #
  # The container runs with readOnlyRootFilesystem: true and the chart sets no
  # HOME. The ECR credential helper resolves $HOME to "" and tries to cache its
  # authorisation token at /.ecr/.config.json, which the read-only root refuses:
  #
  #   level=info msg="Could not save cache"
  #     error="open /.ecr/.config.json.tmp2552917293: no such file or directory"
  #
  # Verification still succeeded, so this is not a correctness defect — but the
  # token was re-fetched on EVERY image verification, putting an STS and an
  # ecr:GetAuthorizationToken round trip inside every admission review. That is
  # a cost the latency experiment would have measured and attributed to
  # admission control.
  #
  # The fix follows the chart's own precedent: it already gives sigstore a
  # writable emptyDir and points TUF_ROOT=/.sigstore at it. This does the same
  # for HOME. Verified by rendering: HOME=/.cache and /.cache appears in the
  # container's volumeMounts.
  #
  # NOTE: admissionController.extraVolumeMounts does not exist in chart 3.1.4 —
  # the volume would be created and never mounted. Only valid from 3.8.x.
  extraVolumes:
    - name: home
      emptyDir: {}
  extraVolumeMounts:
    - name: home
      mountPath: /.cache

backgroundController:
  replicas: 1

reportsController:
  replicas: 1

cleanupController:
  replicas: 1

# The admission-report cleanup CronJobs no longer exist in this chart.
#
# History, because it explains why this block is absent rather than disabled:
# chart 3.1.4 shipped two CronJobs running `bitnami/kubectl:1.28.5` from Docker
# Hub every 10 minutes. They do not pull on these clusters and sat in
# ImagePullBackOff; the bootstraps used to create and then suspend them, but the
# schedule can fire inside that window, which is how stuck pods appeared on a
# fresh cluster. A `cleanupJobs.*.enabled: false` block here suppressed them.
#
# Chart 3.8.2 removes the `cleanupJobs` key entirely — the work moved into the
# cleanup controller. Keeping the old block would be dead configuration that
# Helm ignores in silence, which is the defect this file has already been
# cleaned of twice (D6, and the metricsService block above). Verified by
# rendering both charts with this file: **zero CronJobs on 3.1.4 and on 3.8.2**.
#
# If this project ever pins back to a chart older than 3.8, the block must come
# back or the CronJobs return.

# ── The admission failure policy: the single control point ───────────────────
#
# true  = fail-open  (the default here). If Kyverno cannot be reached, pods are
#         admitted *without verification*. A Kyverno outage cannot take the
#         cluster down; it silently suspends the control instead.
# false = fail-closed. Each ClusterPolicy's own failurePolicy applies, which
#         defaults to Fail, so an outage rejects pod creation in every matched
#         namespace rather than admitting unverified images.
#
# Kyverno generates its webhook configurations at runtime — they are not
# rendered by the chart — so this controller feature flag is the whole control
# surface. Kyverno creates paired `…svc-ignore` / `…svc-fail` webhooks and
# routes each policy's rules to the matching side; this flag forces everything
# onto the `-ignore` side. Verified with:
#   helm template kyverno kyverno/kyverno --version 3.1.4 \
#     --set features.forceFailurePolicyIgnore.enabled=true
# A top-level `failurePolicy` or `forceFailurePolicyIgnore` value does not
# exist in this chart; setting either is silently ignored.
#
# Do not switch this by patching the live WebhookConfiguration objects. That is
# what the bootstraps and the pipeline used to do, in five separate places; it
# fought whatever Kyverno wrote next and it caused the Helm field-manager
# conflict. Use scripts/set-failure-policy.sh, which flips this flag, waits for
# Kyverno to rewrite its webhooks, verifies every Pod-intercepting webhook
# reports the requested value, and records the observed state for the artefact.
#
# The PodDisruptionBudget above is what makes fail-closed survivable; changing
# this to false without it converts a routine node drain into a cluster-wide
# outage of pod creation.
features:
  forceFailurePolicyIgnore:
    enabled: true

webhooksCleanup:
  enabled: false

# Webhook timeout: 10 seconds, Kyverno's default. NOT configured here.
#
# This file used to carry a `config.webhooks[].timeoutSeconds: 15` block with a
# comment claiming a 15-second timeout. It never took effect and has been
# removed. In chart 3.1.4 `config.webhooks` is a list of webhook *selector*
# overrides, the chart has no webhook-timeout value of any kind, and Kyverno
# generates its webhook configurations at runtime rather than from the chart.
# Verified twice: the chart renders `timeoutSeconds` only on pod probes, and the
# live cluster reports 10 on every Kyverno webhook —
#   kubectl get validatingwebhookconfiguration \
#     -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.webhooks[*].timeoutSeconds}{"\n"}{end}'
#
# 10 seconds is therefore the real bound on how long admission can stall when
# the registry or Rekor is slow, and it is the number to cite. Raising it means
# passing a container argument via admissionController.container.extraArgs —
# confirm the flag name against `/kyverno --help` first — and re-running the
# latency and Rekor-failure experiments, since it changes worst-case behaviour.