# helm/kyverno-values.yaml
# Kyverno Helm values — applied by bootstrap.sh and bootstrap-azure.sh.
#
# Used by both AWS and AKS. Cloud-specific configuration (IRSA annotation,
# workload identity label) is passed as --set flags in the bootstrap scripts
# because those values come from Terraform outputs at runtime.
#
# To update Kyverno config, edit this file and re-run the relevant bootstrap.

admissionController:
  replicas: 3
  # serviceAccount annotations and podLabels for IRSA/Workload Identity are
  # set via --set in bootstrap.sh / bootstrap-azure.sh at install time.

backgroundController:
  replicas: 1

reportsController:
  replicas: 1

cleanupController:
  replicas: 1

# The two admission-report cleanup CronJobs are not installed at all.
#
# They run `bitnami/kubectl:1.28.5` from Docker Hub every 10 minutes, which does
# not pull on these clusters — the jobs sit in ImagePullBackOff. The bootstrap
# scripts used to create them and suspend them afterwards, but the schedule can
# fire inside that window, which is how stuck pods appeared on a fresh cluster.
# Disabling them here renders no CronJobs at all, so there is nothing to race.
#
# Nothing in the evaluation depends on them: they delete stale admission reports,
# and the reports controller is scaled to zero by the bootstrap anyway. Admission
# enforcement is entirely unaffected.
cleanupJobs:
  admissionReports:
    enabled: false
  clusterAdmissionReports:
    enabled: false

# Fail-open: if Kyverno is temporarily unreachable, pods are still admitted.
# This prevents a Kyverno outage from taking down the whole cluster.
# In a production hardened environment, change to Fail and ensure Kyverno
# has sufficient replicas and PodDisruptionBudgets.
#
# Kyverno generates its webhook configurations at runtime — they are not
# rendered by the chart — so the fail-open behaviour comes from this controller
# feature flag, which makes Kyverno write failurePolicy=Ignore into every
# webhook it manages. Verified with:
#   helm template kyverno kyverno/kyverno --version 3.1.4 \
#     --set features.forceFailurePolicyIgnore.enabled=true
# A top-level `failurePolicy` or `forceFailurePolicyIgnore` value does not
# exist in this chart; setting either is silently ignored.
features:
  forceFailurePolicyIgnore:
    enabled: true

webhooksCleanup:
  enabled: false

# Prometheus metrics on :8000/metrics — useful during latency measurements.
metricsService:
  create: true
  port: 8000

# Webhook timeout: 10 seconds, Kyverno's default. NOT configured here.
#
# This file used to carry a `config.webhooks[].timeoutSeconds: 15` block with a
# comment claiming a 15-second timeout. It never took effect and has been
# removed. In chart 3.1.4 `config.webhooks` is a list of webhook *selector*
# overrides, the chart has no webhook-timeout value of any kind, and Kyverno
# generates its webhook configurations at runtime rather than from the chart.
# Verified twice: the chart renders `timeoutSeconds` only on pod probes, and the
# live cluster reports 10 on every Kyverno webhook —
#   kubectl get validatingwebhookconfiguration \
#     -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.webhooks[*].timeoutSeconds}{"\n"}{end}'
#
# 10 seconds is therefore the real bound on how long admission can stall when
# the registry or Rekor is slow, and it is the number to cite. Raising it means
# passing a container argument via admissionController.container.extraArgs —
# confirm the flag name against `/kyverno --help` first — and re-running the
# latency and Rekor-failure experiments, since it changes worst-case behaviour.