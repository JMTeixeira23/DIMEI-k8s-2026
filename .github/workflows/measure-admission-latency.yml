name: Measure Admission Latency

# ─────────────────────────────────────────────────────────────────────────────
# ADMISSION LATENCY MEASUREMENT — runs on AWS EKS, Azure AKS, or both.
# Not part of the CD pipeline — run manually to collect thesis data.
#
# Measures what the Kyverno admission webhook costs, across three conditions
# that differ in exactly one variable:
#
#   baseline  — the three ClusterPolicies are absent
#   audit     — the same policies, validationFailureAction: Audit
#   enforce   — the same policies, validationFailureAction: Enforce
#
# The conditions run in a randomised order, each preceded by a wait for the
# cluster to reach the requested state and a settle period, so that no single
# condition systematically absorbs the webhook re-registration that follows a
# policy change.
#
# Everything else — mutateDigest, verifyDigest, attestors, the image under test —
# is held constant, and matches what the pipeline actually deploys.
#
# METHOD
#
# Probe pods are created in supply-chain-demo, the namespace the policies match,
# and carry a nodeSelector no node satisfies. Admission runs in full because it
# happens at create time; scheduling, image pull and container execution never
# happen. Two views are recorded per condition: Kyverno's own histograms as
# delta_sum/delta_count summed across all admission replicas (the authoritative
# mean), and client-side wall clock per request (the only per-request sample,
# used for distributions). See scripts/measure-admission.sh.
#
# WHAT THIS REPLACES
#
# The previous version created every probe in the `default` namespace, which no
# policy matches, and timed pod completion rather than admission. It therefore
# measured pod pull and scheduling with the policies never evaluated. Every
# Phase 4 and Phase 4b number produced before 2026-08-01 is void.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Which cloud(s) to measure'
        required: true
        default: 'aws'
        type: choice
        options: [both, aws, azure]
      iterations:
        description: 'Admission requests per condition (default: 30)'
        required: false
        default: '30'
      size_iterations:
        description: 'Requests per image size — size experiment (default: 20)'
        required: false
        default: '20'
      failure_policy:
        description: >-
          Admission failure configuration to measure under. "as-is" measures the
          cluster as it stands. "ignore" is fail-open, "fail" is fail-closed;
          both switch the cluster before measurement and leave it that way.
        required: false
        default: 'as-is'
        type: choice
        options: [as-is, ignore, fail]
      concurrency_levels:
        description: >-
          Revision item 1.4. Space-separated concurrency levels to sweep, e.g.
          "1 5 10 25 50". Blank (the default) skips the sweep entirely, so
          existing runs are unaffected. Each level sends the same number of
          requests, delivered in batches of N in parallel.
        required: false
        default: ''
      concurrency_requests:
        description: 'Requests per concurrency level (default: 50)'
        required: false
        default: '50'
      condition_order:
        description: >-
          Optional explicit order for the policy matrix, e.g.
          "baseline audit enforce". Leave blank to derive the order from the run
          id. Set it to break the position confound: every run so far measured
          enforce second and audit third, so the audit-vs-enforce difference
          cannot be separated from measurement order. Recorded in the artefact
          as order_source=explicit, so an artefact never claims to be randomised
          when it was chosen.
        required: false
        default: ''
      # There is deliberately no cold-cache input. Kyverno v1.11.4 has no image
      # verification cache — confirmed from the running container's arguments,
      # and chart 3.1.4 exposes no such value — so there is no warm/cold split to
      # isolate. Every admission pays the full verification path including the
      # Rekor round trip. The preflight still records the flag state, so if this
      # cluster is ever upgraded to a version that has the cache, the artefact
      # will say so and the condition can be added back.

# One cluster, one evidence run at a time. Two workflows that both call
# scripts/set-failure-policy.sh will collide on the Helm release lock —
# "another operation (install/upgrade/rollback) is in progress", which is what
# aborted run 30703179531. Queueing rather than cancelling: an evidence run that
# is halfway through mutating the cluster should finish, not be killed.
concurrency:
  group: kyverno-cluster-${{ github.repository }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          CLOUD="${{ inputs.cloud }}"
          if [ -z "${CLOUD}" ] || [ "${CLOUD}" = "both" ]; then
            echo 'matrix={"include":[{"cloud":"aws"},{"cloud":"azure"}]}' >> $GITHUB_OUTPUT
          else
            echo "matrix={\"include\":[{\"cloud\":\"${CLOUD}\"}]}" >> $GITHUB_OUTPUT
          fi

  measure:
    name: Latency (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.cloud }}
    needs: setup

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      CLOUD: ${{ matrix.cloud }}
      NAMESPACE: supply-chain-demo
      RESULTS_DIR: /tmp/latency-results

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── Auth ──────────────────────────────────────────────────────────────

      - name: Auth — AWS
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: latency-${{ github.run_id }}

      - name: Auth — Azure
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Registry login — ECR
        if: matrix.cloud == 'aws'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Registry login — ACR
        if: matrix.cloud == 'azure'
        run: az acr login --name "${{ secrets.ACR_LOGIN_SERVER }}"

      - name: Kubeconfig — EKS
        if: matrix.cloud == 'aws'
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Kubeconfig — AKS
        if: matrix.cloud == 'azure'
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AKS_RESOURCE_GROUP }}" \
            --name "${{ secrets.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      # ── Resolve the image under test ──────────────────────────────────────
      # By digest, matching how the pipeline's TC-01 and the attack simulations
      # deploy. A tag reference would add a registry resolution to every request
      # and measure something the deployed configuration does not do.

      - name: Resolve the signed image by digest
        run: |
          set -euo pipefail
          if [ "${CLOUD}" = "aws" ]; then
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            REPO="${{ secrets.ECR_REPO_NAME }}"
            TAG=$(aws ecr describe-images \
              --repository-name "${REPO}" \
              --region "${{ secrets.AWS_REGION }}" \
              --output json \
              | jq -r '
                  .imageDetails
                  | map(select(.imageTags != null))
                  | map(select(.imageTags[] | test("^sha256") | not))
                  | map(select(.imageTags[] | test("-")))
                  | map(select(.imageTags[] | test("^(attack|size-|tc04|lat-)") | not))
                  | sort_by(.imagePushedAt) | last | .imageTags[0]')
            DIGEST=$(aws ecr describe-images \
              --repository-name "${REPO}" \
              --region "${{ secrets.AWS_REGION }}" \
              --image-ids imageTag="${TAG}" \
              --query 'imageDetails[0].imageDigest' --output text)
          else
            REGISTRY="${{ secrets.ACR_LOGIN_SERVER }}"
            REPO="${{ secrets.ACR_REPO_NAME }}"
            TAG=$(az acr repository show-tags \
              --name "${REGISTRY}" --repository "${REPO}" \
              --orderby time_desc --output tsv \
              | grep -E '^[a-f0-9]+-[0-9]+$' \
              | grep -vE '^(attack|size-|tc04|lat-)' | head -1)
            DIGEST=$(az acr repository show \
              --name "${REGISTRY}" --image "${REPO}:${TAG}" \
              --query digest --output tsv)
          fi

          echo "PROBE_IMAGE=${REGISTRY}/${REPO}@${DIGEST}" >> $GITHUB_ENV
          echo "Image under test: ${REGISTRY}/${REPO}@${DIGEST}  (tag ${TAG})"
      # ── Admission failure configuration ───────────────────────────────
      # Revision 1.3 requires the performance evaluation to be reported under
      # both fail-open and fail-closed. Under fail-closed a slow webhook stops
      # being free: the request waits the full webhook timeout and is then
      # rejected, rather than waiting and being admitted unverified. The tail of
      # the distribution is where that difference shows, which is why the
      # percentiles matter more here than the mean.
      - name: Set the admission failure policy
        if: ${{ inputs.failure_policy != 'as-is' }}
        run: |
          bash scripts/set-failure-policy.sh "${{ inputs.failure_policy }}"


      # ── Preflight ─────────────────────────────────────────────────────────

      - name: Preflight — record the environment being measured
        id: preflight
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS_DIR}"

          kubectl create namespace "${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

          KYVERNO_IMAGE=$(kubectl get deployment kyverno-admission-controller -n kyverno \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          REPLICAS=$(kubectl get deployment kyverno-admission-controller -n kyverno \
            -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
          ARGS=$(kubectl get deployment kyverno-admission-controller -n kyverno \
            -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null || true)
          WEBHOOKS=$(kubectl get mutatingwebhookconfigurations -o json 2>/dev/null \
            | jq -r '[.items[] | select(.metadata.name | test("kyverno"))
                      | .webhooks[] | "\(.name)=\(.failurePolicy)"] | join(" ")' || true)

          # Does this Kyverno build know about the image verification cache,
          # and — the part that matters — is it ON or OFF for this run?
          #
          # This used to record only `present-in-args`, which was enough when
          # the flag's presence was the whole question (Kyverno v1.11.4 did not
          # have it at all — defect D13). It is not enough now. v1.18.2 enables
          # the cache by default, so the latency matrix is run twice, once with
          # it on and once off, and the two artefacts would have been
          # INDISTINGUISHABLE under the old recording: both `present-in-args`.
          # Two arms of a comparison that cannot be told apart is worse than no
          # comparison. The effective value is recorded instead.
          CACHE_FLAG="unknown"
          CACHE_ENABLED="unknown"
          if printf '%s' "${ARGS}" | grep -q "imageVerifyCache"; then
            CACHE_FLAG="present-in-args"
            CACHE_ENABLED=$(printf '%s' "${ARGS}" | tr ' ' '\n' \
              | sed -n 's/^--imageVerifyCacheEnabled=//p' | head -1)
            CACHE_ENABLED="${CACHE_ENABLED:-unknown}"
          elif kubectl exec -n kyverno deploy/kyverno-admission-controller -- \
                 /kyverno --help 2>&1 | grep -qi "imageVerifyCache"; then
            # Supported but not passed explicitly, so whatever the build
            # defaults to. v1.18.2 defaults to enabled.
            CACHE_FLAG="supported"
            CACHE_ENABLED="default-for-build"
          else
            CACHE_FLAG="not-supported"
            CACHE_ENABLED="false"
          fi
          echo "  image verification cache: ${CACHE_FLAG} / enabled=${CACHE_ENABLED}"
          echo "cache_flag=${CACHE_FLAG}"       >> $GITHUB_OUTPUT
          echo "cache_enabled=${CACHE_ENABLED}" >> $GITHUB_OUTPUT

          jq -n \
            --arg cloud "${CLOUD}" \
            --arg image "${PROBE_IMAGE}" \
            --arg kyverno_image "${KYVERNO_IMAGE:-unknown}" \
            --arg replicas "${REPLICAS:-unknown}" \
            --arg args "${ARGS:-unknown}" \
            --arg webhooks "${WEBHOOKS:-unknown}" \
            --arg cache_flag "${CACHE_FLAG}" \
            --arg cache_enabled "${CACHE_ENABLED}" \
            --arg context "$(kubectl config current-context)" \
            --arg namespace "${NAMESPACE}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson admission "$(bash scripts/webhook-state.sh)" \
            '{cloud: $cloud, probe_image: $image, kyverno_image: $kyverno_image,
              kyverno_ready_replicas: $replicas, admission_controller_args: $args,
              mutating_webhook_failure_policies: $webhooks,
              admission: $admission,
              image_verify_cache_flag: $cache_flag,
              image_verify_cache_enabled: $cache_enabled,
              kubectl_context: $context,
              probe_namespace: $namespace, run_url: $run_url, generated: $generated}' \
            > "${RESULTS_DIR}/_environment.json"

          cat "${RESULTS_DIR}/_environment.json"
          echo ""
          echo "Image verification cache flag: ${CACHE_FLAG}"

      # ── The matrix ────────────────────────────────────────────────────────
      # baseline / audit / enforce, in a randomised order, each preceded by an
      # explicit wait for the cluster to report the state just requested and a
      # settle period. See scripts/run-latency-matrix.sh for why the order is
      # randomised: run in a fixed sequence, one condition always absorbs the
      # webhook re-registration that follows a policy change, and its tail is
      # then a property of its position rather than of the condition.

      # `iterations: 0` skips the matrix entirely, mirroring how the size job is
      # skipped by `size_iterations: 0`. Without this the matrix would still
      # delete and re-apply the policies for each condition, record nothing, and
      # then fail the report step with "no requests were recorded" — taking the
      # concurrency sweep down with it, since later steps do not run after a
      # failed one. Needed to run the sweep on its own.
      - name: Measure the baseline / audit / enforce matrix
        if: ${{ inputs.iterations != '0' }}
        env:
          ITERATIONS: ${{ inputs.iterations }}
          SETTLE_SECONDS: '30'
          WARMUP: '5'
          RANDOM_SEED: ${{ github.run_id }}
          CONDITION_ORDER: ${{ inputs.condition_order }}
        run: bash scripts/run-latency-matrix.sh

      # ── Report ────────────────────────────────────────────────────────────

      - name: Build the latency artefact
        if: ${{ always() && inputs.iterations != '0' }}
        run: |
          python3 scripts/latency_report.py \
            --results-dir "${RESULTS_DIR}" \
            --cloud "${CLOUD}" \
            --out "latency-${CLOUD}.json" \
            --csv "latency-${CLOUD}.csv"

      - name: Upload latency artefact
        if: ${{ always() && inputs.iterations != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: latency-${{ matrix.cloud }}
          path: |
            latency-*.json
            latency-*.csv
            /tmp/latency-results/requests.csv
          if-no-files-found: error
          retention-days: 90

      # ── Restore ───────────────────────────────────────────────────────────
      # The cluster must be left enforcing, whatever happened above: the attack
      # simulations and the pipeline both assume Enforce.

      - name: Restore the deployed policy configuration
        if: always()
        run: |
          REGISTRY_VAL=$(grep '^REGISTRY=' policies/values/${CLOUD}.env | cut -d= -f2)
          mkdir -p /tmp/kyverno-restore
          for f in policies/verify-*.yaml; do
            sed "s|REGISTRY_PLACEHOLDER|${REGISTRY_VAL}|g" "$f" \
              > "/tmp/kyverno-restore/$(basename $f)"
          done
          kubectl apply --server-side --force-conflicts -f /tmp/kyverno-restore/ || true
          kubectl delete pods -n "${NAMESPACE}" \
            -l experiment=admission-latency --wait=false 2>/dev/null || true
          kubectl get clusterpolicies -o wide || true

      # ── Concurrency sweep (revision item 1.4) ─────────────────────────────
      # Runs after the restore above, so the policies are in Enforce — the
      # configuration actually deployed, and the only one where the question is
      # interesting. Lives in this job rather than its own because it needs the
      # same kubeconfig and the same resolved probe image; a fourth job would
      # duplicate the auth preamble to no benefit.
      #
      # Skipped unless levels are requested, so existing runs are unaffected.

      - name: Measure admission under concurrency
        if: ${{ inputs.concurrency_levels != '' }}
        env:
          RESULTS_DIR: /tmp/concurrency-results
          SETTLE_SECONDS: '10'
          WARMUP: '5'
        run: |
          set -euo pipefail
          for P in verify-image-signature verify-sbom-cyclonedx verify-slsa-provenance; do
            ACTION=$(kubectl get clusterpolicy "$P" \
              -o jsonpath='{.spec.validationFailureAction}' 2>/dev/null || true)
            if [ "${ACTION:-MISSING}" != "Enforce" ]; then
              echo "ERROR: the concurrency sweep requires all policies in Enforce; $P is ${ACTION:-MISSING}."
              exit 1
            fi
          done

          mkdir -p "${RESULTS_DIR}"
          jq -n \
            --arg cloud "${CLOUD}" \
            --arg image "${PROBE_IMAGE}" \
            --arg levels "${{ inputs.concurrency_levels }}" \
            --arg requests "${{ inputs.concurrency_requests }}" \
            --arg namespace "${NAMESPACE}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runner "$(nproc) vCPU, $(free -m | awk '/^Mem:/{print $2}') MB" \
            --argjson admission "$(bash scripts/webhook-state.sh)" \
            '{cloud: $cloud, probe_image: $image, probe_namespace: $namespace,
              experiment: "admission cost under concurrent pod creation",
              concurrency_levels: $levels, requests_per_level: $requests,
              runner: $runner, admission: $admission,
              run_url: $run_url, generated: $generated}' \
            > "${RESULTS_DIR}/_environment.json"

          bash scripts/measure-concurrency.sh \
            "${PROBE_IMAGE}" \
            "${{ inputs.concurrency_levels }}" \
            "${{ inputs.concurrency_requests }}"

      - name: Build the concurrency artefact
        if: ${{ always() && inputs.concurrency_levels != '' }}
        env:
          RESULTS_DIR: /tmp/concurrency-results
        run: |
          python3 scripts/latency_report.py \
            --results-dir "${RESULTS_DIR}" \
            --cloud "${CLOUD}" \
            --out "concurrency-${CLOUD}.json" \
            --csv "concurrency-${CLOUD}.csv"

      - name: Upload concurrency artefact
        if: ${{ always() && inputs.concurrency_levels != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-${{ matrix.cloud }}
          path: |
            concurrency-*.json
            concurrency-*.csv
            /tmp/concurrency-results/requests.csv
            /tmp/concurrency-results/_concurrency.json
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup concurrency probes
        if: ${{ always() && inputs.concurrency_levels != '' }}
        run: |
          kubectl delete pods -n "${NAMESPACE}" \
            -l experiment=admission-latency --wait=false 2>/dev/null || true

  # ───────────────────────────────────────────────────────────────────────────
  # IMAGE SIZE vs ADMISSION COST
  #
  # Hypothesis: admission cost is O(1) in image size, because Kyverno verifies
  # signatures and attestations against the registry and Rekor without pulling
  # image layers.
  #
  # The previous version could not test this: its probes ran in `default`, so no
  # verification happened at any size, and it timed pod completion, which is
  # dominated by the image pull the hypothesis says Kyverno avoids. A flat line
  # was guaranteed regardless of whether the hypothesis holds. Here the probes
  # are unschedulable and in the policy-matched namespace, so nothing is pulled
  # by the probe and the only work measured is verification.
  # ───────────────────────────────────────────────────────────────────────────

  build-size-images:
    name: Build Size Images (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.cloud }}
    needs: [setup, measure]
    # Skipped entirely when no size iterations are requested, rather than
    # building, signing and attesting four images for a measurement that will
    # not happen.
    if: ${{ inputs.size_iterations != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Auth — AWS
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: size-build-${{ github.run_id }}

      - name: Auth — Azure
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Registry login — ECR
        if: matrix.cloud == 'aws'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Registry login — ACR
        if: matrix.cloud == 'azure'
        run: az acr login --name "${{ secrets.ACR_LOGIN_SERVER }}"

      - name: Set unified registry vars
        run: |
          if [ "${{ matrix.cloud }}" = "aws" ]; then
            echo "REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> $GITHUB_ENV
            echo "REPO=${{ secrets.ECR_REPO_NAME }}" >> $GITHUB_ENV
          else
            echo "REGISTRY=${{ secrets.ACR_LOGIN_SERVER }}" >> $GITHUB_ENV
            echo "REPO=${{ secrets.ACR_REPO_NAME }}" >> $GITHUB_ENV
          fi

      - name: Install Cosign and Syft
        run: |
          curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64 \
            -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
          # Syft, pinned by release archive rather than by piping an
          # installer from a mutable branch into a shell -- the pattern
          # this project exists to argue against.
          curl -sSfL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz"
          tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          chmod +x /usr/local/bin/syft

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Provenance comes from the same generator the pipeline uses. This job used
      # to inline a hand-written predicate, so the size images carried a
      # different provenance shape from every other image in the project.
      - name: Build, push, sign and attest all size images
        env:
          GH_REPOSITORY:  ${{ github.repository }}
          GH_REF_NAME:    ${{ github.ref_name }}
          GH_SHA:         ${{ github.sha }}
          GH_EVENT:       ${{ github.event_name }}
          GH_WORKFLOW:    ${{ github.workflow }}
          GH_RUN_ID:      ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          CLOUD:          ${{ matrix.cloud }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/size-refs

          for SIZE in small medium large xlarge; do
            TAG="size-${SIZE}-${{ github.run_id }}"
            IMAGE="${REGISTRY}/${REPO}:${TAG}"

            echo "── ${SIZE} ──"
            docker buildx build \
              --tag "${IMAGE}" \
              --push \
              --provenance=false \
              --metadata-file /tmp/meta-${SIZE}.json \
              docker/${SIZE}/

            DIGEST=$(jq -r '."containerimage.digest"' /tmp/meta-${SIZE}.json)
            IMAGE_REF="${REGISTRY}/${REPO}@${DIGEST}"

            cosign sign --yes "${IMAGE_REF}"

            syft "${IMAGE_REF}" -o cyclonedx-json=/tmp/sbom-${SIZE}.json
            cosign attest --yes --type cyclonedx \
              --predicate /tmp/sbom-${SIZE}.json "${IMAGE_REF}"

            FULL_IMAGE="${IMAGE}" \
            BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            python3 scripts/gen_slsa_provenance.py
            cosign attest --yes --type slsaprovenance1 \
              --predicate provenance.json "${IMAGE_REF}"

            echo "${IMAGE_REF}" > /tmp/size-refs/${SIZE}.txt

            # The independent variable of this experiment, measured rather than
            # asserted. Until this existed, the only record of how big these
            # images were was a comment in the Dockerfile, which is not evidence
            # — "admission cost is flat across an 80x size range" cannot be
            # written without the range. Sizes are the compressed bytes the
            # registry stores, which is what a puller transfers; the point of
            # the experiment is that Kyverno transfers none of it.
            docker manifest inspect "${IMAGE_REF}" > /tmp/manifest-${SIZE}.json
            jq -n \
              --arg name "${SIZE}" \
              --arg ref "${IMAGE_REF}" \
              --arg digest "${DIGEST}" \
              --argjson manifest "$(cat /tmp/manifest-${SIZE}.json)" \
              '{name: $name, image_ref: $ref, digest: $digest,
                compressed_bytes: ([$manifest.config.size]
                                   + [$manifest.layers[].size] | add),
                layer_count: ($manifest.layers | length)}' \
              > /tmp/size-refs/${SIZE}.json

            echo "${SIZE} -> ${IMAGE_REF}"
            jq -r '"  \(.compressed_bytes) bytes in \(.layer_count) layers"' \
              /tmp/size-refs/${SIZE}.json
          done

          jq -s 'sort_by(.compressed_bytes)' /tmp/size-refs/*.json \
            > /tmp/size-refs/_sizes.json
          echo "── measured sizes ──"
          jq -r '.[] | "\(.name)\t\(.compressed_bytes) bytes\t\(.layer_count) layers"' \
            /tmp/size-refs/_sizes.json

      - name: Upload size image refs
        uses: actions/upload-artifact@v4
        with:
          name: size-refs-${{ matrix.cloud }}
          path: /tmp/size-refs/
          retention-days: 1

  measure-size-latency:
    name: Measure Size Latency (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.cloud }}
    needs: [setup, build-size-images]
    if: ${{ inputs.size_iterations != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      CLOUD: ${{ matrix.cloud }}
      NAMESPACE: supply-chain-demo
      RESULTS_DIR: /tmp/size-results

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Auth — AWS
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: size-measure-${{ github.run_id }}

      - name: Auth — Azure
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Kubeconfig — EKS
        if: matrix.cloud == 'aws'
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Kubeconfig — AKS
        if: matrix.cloud == 'azure'
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AKS_RESOURCE_GROUP }}" \
            --name "${{ secrets.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Download size image refs
        uses: actions/download-artifact@v4
        with:
          name: size-refs-${{ matrix.cloud }}
          path: /tmp/size-refs/

      - name: Preflight — confirm Enforce and record the environment
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS_DIR}"
          kubectl create namespace "${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

          FAIL=0
          for P in verify-image-signature verify-sbom-cyclonedx verify-slsa-provenance; do
            ACTION=$(kubectl get clusterpolicy "$P" \
              -o jsonpath='{.spec.validationFailureAction}' 2>/dev/null || true)
            [ "${ACTION:-MISSING}" = "Enforce" ] || { echo "❌ $P: ${ACTION:-MISSING}"; FAIL=1; }
          done
          if [ "${FAIL}" = "1" ]; then
            echo "ERROR: the size experiment requires all policies in Enforce."
            exit 1
          fi

          jq -n \
            --arg cloud "${CLOUD}" \
            --arg kyverno_image "$(kubectl get deployment kyverno-admission-controller \
              -n kyverno -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo unknown)" \
            --arg replicas "$(kubectl get deployment kyverno-admission-controller \
              -n kyverno -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo unknown)" \
            --arg namespace "${NAMESPACE}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson images "$(cat /tmp/size-refs/_sizes.json)" \
            --argjson admission "$(bash scripts/webhook-state.sh)" \
            '{cloud: $cloud, kyverno_image: $kyverno_image,
              kyverno_ready_replicas: $replicas, probe_namespace: $namespace,
              experiment: "image size vs admission cost",
              images: $images, admission: $admission,
              run_url: $run_url, generated: $generated}' \
            > "${RESULTS_DIR}/_environment.json"

      # Randomised for the same reason the policy matrix is: run in a fixed
      # ascending order, whichever size goes first absorbs session warm-up and
      # reports as the slowest. On run 30692789440 that produced "smaller images
      # are admitted more slowly" at p = 0.02 in both comparisons against the
      # first condition — an effect no mechanism can produce, and a drift of the
      # same magnitude as the entire enforce-vs-baseline result.
      - name: Measure admission cost per image size
        run: |
          set -euo pipefail
          SEED="${GITHUB_RUN_ID}"
          # Was `shuf --random-source=<(yes "${SEED}")`, which does not
          # randomise: shuf reads only a few bytes of that repeated string, and
          # consecutive GitHub run ids share their leading digits, so the
          # permutation was constant. Measured: 100 consecutive run ids all give
          # `xlarge medium large small`, which is what both runs that have
          # executed this job recorded. Same defect and same fix as
          # scripts/run-latency-matrix.sh — see the comment there.
          # Kept to one line on purpose: this is a YAML block scalar, so a
          # multi-line python -c body at column 0 would end the block.
          ORDER_STR=$(python3 -c "import random,sys; c=list(sys.argv[2:]); random.Random(int(sys.argv[1])).shuffle(c); print(' '.join(c))" "${SEED}" small medium large xlarge)
          read -r -a ORDER <<< "${ORDER_STR}"

          echo "Size order: ${ORDER[*]}   (seed ${SEED})"
          jq -n \
            --arg seed "${SEED}" \
            --argjson order "$(printf '%s\n' "${ORDER[@]}" | jq -R . | jq -s .)" \
            '{condition_order: $order, random_seed: $seed,
              rationale: "sizes randomised so no single size systematically absorbs session warm-up"}' \
            > "${RESULTS_DIR}/_order.json"

          for SIZE in "${ORDER[@]}"; do
            IMAGE_REF=$(cat /tmp/size-refs/${SIZE}.txt)
            bash scripts/measure-admission.sh "size-${SIZE}" "${IMAGE_REF}" \
              "${{ inputs.size_iterations }}" "size"
          done

      - name: Build the size artefact
        if: always()
        run: |
          python3 scripts/latency_report.py \
            --results-dir "${RESULTS_DIR}" \
            --cloud "${CLOUD}" \
            --out "size-latency-${CLOUD}.json" \
            --csv "size-latency-${CLOUD}.csv"

      - name: Upload size latency artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-latency-${{ matrix.cloud }}
          path: |
            size-latency-*.json
            size-latency-*.csv
            /tmp/size-results/requests.csv
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup
        if: always()
        run: |
          kubectl delete pods -n "${NAMESPACE}" \
            -l experiment=admission-latency --wait=false 2>/dev/null || true
