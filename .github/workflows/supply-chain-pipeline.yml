name: Supply Chain Security Pipeline

# Unified CD pipeline - runs on AWS EKS and Azure AKS in parallel via matrix.
#
# The only cloud-specific steps are auth, registry login, and kubeconfig.
# Everything from signing through policy enforcement is identical on both clouds.
#
# Triggered automatically when docker/ changes. Can also be run manually
# to target a specific cloud or to verify the pipeline after infrastructure changes.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Which cloud(s) to run on'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - aws
          - azure

# One cluster, one evidence run at a time. Two workflows that both call
# scripts/set-failure-policy.sh will collide on the Helm release lock —
# "another operation (install/upgrade/rollback) is in progress", which is what
# aborted run 30703179531. Queueing rather than cancelling: an evidence run that
# is halfway through mutating the cluster should finish, not be killed.
concurrency:
  group: kyverno-cluster-${{ github.repository }}
  cancel-in-progress: false

permissions:
  id-token: write      # OIDC auth to AWS/Azure, and Cosign keyless signing
  contents: read
  actions: read
  attestations: write  # actions/attest-build-provenance (SLSA L2, revision 3.1)

env:
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # ── The SLSA Build L2 switch (revision item 3.1) ────────────────────────────
  # "true"  → additionally emit platform-generated, platform-signed provenance
  #           via actions/attest-build-provenance. Purely additive.
  # "false" → the pipeline is exactly what it was: Cosign-attested provenance
  #           generated in-build, which is SLSA Build L1.
  #
  # This one value is the entire revert path. The admission policy verifies the
  # Cosign attestation either way and never reads the L2 one, so flipping this
  # cannot change what the cluster accepts.
  #
  # Set the repository variable SLSA_L2 to override without editing this file.
  SLSA_L2: ${{ vars.SLSA_L2 || 'true' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          CLOUD="${{ inputs.cloud }}"
          if [ -z "${CLOUD}" ] || [ "${CLOUD}" = "both" ]; then
            echo 'matrix={"include":[{"cloud":"aws"},{"cloud":"azure"}]}' >> $GITHUB_OUTPUT
          elif [ "${CLOUD}" = "aws" ]; then
            echo 'matrix={"include":[{"cloud":"aws"}]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"include":[{"cloud":"azure"}]}' >> $GITHUB_OUTPUT
          fi

  supply-chain:
    name: Supply Chain (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.cloud }}
    needs: setup

    env:
      CLOUD: ${{ matrix.cloud }}
      RESULTS_DIR: /tmp/testcase-results

    strategy:
      fail-fast: false   # keep the other cloud running if one fails
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # --- Auth (cloud-specific) -------------------------------------------
      # Both use OIDC federation - no long-lived credentials stored anywhere.

      - name: Auth - AWS
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: supply-chain-${{ github.run_id }}

      - name: Auth - Azure
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --- Registry login (cloud-specific) ---------------------------------

      - name: Registry login - ECR
        if: matrix.cloud == 'aws'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Registry login - ACR
        if: matrix.cloud == 'azure'
        run: az acr login --name "${{ secrets.ACR_LOGIN_SERVER }}"

      # Normalise registry/repo into cloud-agnostic env vars used by all
      # subsequent steps. After this point no step needs to know which cloud it is.
      - name: Set registry env vars
        run: |
          if [ "${{ matrix.cloud }}" = "aws" ]; then
            echo "REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> $GITHUB_ENV
            echo "REPO=${{ secrets.ECR_REPO_NAME }}"               >> $GITHUB_ENV
          else
            echo "REGISTRY=${{ secrets.ACR_LOGIN_SERVER }}"        >> $GITHUB_ENV
            echo "REPO=${{ secrets.ACR_REPO_NAME }}"               >> $GITHUB_ENV
          fi

      # --- Build & Push ----------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        run: |
          FULL_IMAGE="${REGISTRY}/${REPO}:${IMAGE_TAG}"

          docker buildx build \
            --build-arg GIT_SHA="${IMAGE_TAG}" \
            --tag "${FULL_IMAGE}" \
            --push \
            --provenance=false \
            --metadata-file /tmp/build-metadata.json \
            docker/hello-world

          # Extract the content-addressable digest from the build output.
          # All downstream steps (sign, attest, verify, policy tests) use this
          # digest reference so Kyverno can verify without re-pulling layers.
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)
          IMAGE_REF="${REGISTRY}/${REPO}@${DIGEST}"

          echo "FULL_IMAGE=${FULL_IMAGE}" >> $GITHUB_ENV
          echo "DIGEST=${DIGEST}"         >> $GITHUB_ENV
          echo "IMAGE_REF=${IMAGE_REF}"   >> $GITHUB_ENV
          echo "Built: ${IMAGE_REF}"

      # --- Sign (Cosign keyless) -------------------------------------------
      # Cosign exchanges the GitHub Actions OIDC token for a short-lived Fulcio
      # certificate. The cert + signature are recorded in Rekor (public log).
      # No private keys involved - the identity is the workflow path itself.

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.1.2

      - name: Sign image
        run: |
          cosign sign --yes "${IMAGE_REF}"
          echo "Signed: ${IMAGE_REF}"

      # --- SBOM (CycloneDX) ------------------------------------------------
      # Syft scans the image layers and produces a full package inventory.
      # Attached as a signed attestation so Kyverno can verify it at admission.

      - name: Install Syft
        run: |
          # Syft, pinned by release archive rather than by piping an
          # installer from a mutable branch into a shell -- the pattern
          # this project exists to argue against.
          curl -sSfL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz"
          tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          chmod +x /usr/local/bin/syft

      - name: Generate and attest SBOM
        run: |
          syft "${IMAGE_REF}" --output cyclonedx-json=sbom.cdx.json
          echo "SBOM components: $(jq '.components | length' sbom.cdx.json)"

          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${IMAGE_REF}"
          echo "SBOM attested"

      # --- SLSA Provenance -------------------------------------------------
      # Records where and how the image was built - repo, commit, workflow,
      # run ID. Meets SLSA v1.0 Build L1. Attached as a signed attestation.

      - name: Generate and attest SLSA provenance
        env:
          GH_REPOSITORY:  ${{ github.repository }}
          GH_REF_NAME:    ${{ github.ref_name }}
          GH_SHA:         ${{ github.sha }}
          GH_EVENT:       ${{ github.event_name }}
          GH_WORKFLOW:    ${{ github.workflow }}
          GH_RUN_ID:      ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          CLOUD:          ${{ matrix.cloud }}
        run: |
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          FULL_IMAGE="${FULL_IMAGE}" \
          BUILD_TIMESTAMP="${BUILD_TIMESTAMP}" \
          python3 scripts/gen_slsa_provenance.py

          cosign attest --yes \
            --predicate provenance.json \
            --type slsaprovenance1 \
            "${IMAGE_REF}"
          echo "Provenance attested"

      # --- SLSA Build Level 2 (additive, revertible) ------------------------
      # Revision item 3.1. Everything above produces provenance from *inside the
      # build job*, which means the build can forge its own provenance — that is
      # the L1/L2 line. actions/attest-build-provenance has the hosted platform
      # generate and sign the statement instead.
      #
      # ── HOW TO REVERT TO L1, COMPLETELY ──────────────────────────────────
      #   Set the repository variable SLSA_L2 to "false", or change the default
      #   in the `env:` block at the top of this file. Nothing else. The two
      #   steps below are the entire L2 surface.
      #
      # ── WHY IT CANNOT BREAK L1 ───────────────────────────────────────────
      #   1. Purely additive. gen_slsa_provenance.py, the three cosign steps and
      #      the verification step above are untouched.
      #   2. Different storage. This publishes an OCI *referrer*; Kyverno reads
      #      the Cosign attestation tag (sha256-<digest>.att). They do not
      #      collide, and the admission policy never looks at this one.
      #   3. continue-on-error. If the attest step fails, the pipeline carries
      #      on with its L1 guarantees intact, and the failure is *recorded* in
      #      the evidence artefact rather than swallowed.
      #
      # The evidence artefact separates what was observed from what it is taken
      # to mean; the level is an interpretation and is labelled as one.

      - name: SLSA Build L2 — platform-generated provenance
        id: slsa-l2
        if: ${{ env.SLSA_L2 == 'true' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPO }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Record the SLSA L2 evidence
        if: always()
        env:
          CLOUD: ${{ matrix.cloud }}
          L2_ENABLED: ${{ env.SLSA_L2 == 'true' }}
          L2_OUTCOME: ${{ env.SLSA_L2 == 'true' && steps.slsa-l2.outcome || 'skipped' }}
          BUNDLE_PATH: ${{ steps.slsa-l2.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="slsa-l2-${CLOUD}.json" \
          IMAGE_REF="${IMAGE_REF}" \
          SUBJECT_DIGEST="${DIGEST}" \
            bash scripts/slsa-l2-evidence.sh

      - name: Upload the SLSA L2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slsa-l2-${{ matrix.cloud }}
          path: slsa-l2-*.json
          if-no-files-found: warn
          retention-days: 90

      # --- Verify attestations ---------------------------------------------
      # Re-verify everything from scratch to confirm the full attestation chain
      # is intact before we proceed to cluster deployment.
      #
      # This is the L1 path and the one the admission policy depends on. It is
      # deliberately placed *after* the L2 steps so that if L2 ever did disturb
      # the registry state, this would fail here rather than silently at TC-01.

      - name: Verify signature and attestations
        run: |
          CERT_REGEXP="https://github.com/${{ github.repository }}.*"
          CERT_ISSUER="https://token.actions.githubusercontent.com"

          cosign verify \
            --certificate-identity-regexp "${CERT_REGEXP}" \
            --certificate-oidc-issuer "${CERT_ISSUER}" \
            "${IMAGE_REF}"
          echo "Signature verified"

          cosign verify-attestation \
            --certificate-identity-regexp "${CERT_REGEXP}" \
            --certificate-oidc-issuer "${CERT_ISSUER}" \
            --type cyclonedx "${IMAGE_REF}" \
            | jq -r '.payload | @base64d | fromjson |
                "SBOM verified - components: \(.predicate.components | length)"'

          cosign verify-attestation \
            --certificate-identity-regexp "${CERT_REGEXP}" \
            --certificate-oidc-issuer "${CERT_ISSUER}" \
            --type slsaprovenance1 "${IMAGE_REF}" \
            | jq -r '.payload | @base64d | fromjson |
                "Provenance verified - builder: \(.predicate.runDetails.builder.id)"'

          echo "--- attestation tree ---"
          cosign tree "${IMAGE_REF}"

      # --- Kubeconfig (cloud-specific) -------------------------------------

      - name: Kubeconfig - EKS
        if: matrix.cloud == 'aws'
        run: |
          aws eks update-kubeconfig \
            --region "${{ secrets.AWS_REGION }}" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Kubeconfig - AKS
        if: matrix.cloud == 'azure'
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AKS_RESOURCE_GROUP }}" \
            --name "${{ secrets.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      # Exclude the default namespace from Kyverno webhooks. The smoke test
      # runs in supply-chain-demo, but kubectl itself creates objects in default
      # during connection setup and those should not be intercepted.
      - name: Exclude default namespace from Kyverno
        run: |
          kubectl label namespace default kyverno.io/exclude=always \
            --overwrite 2>/dev/null || true

      # The failure policy is NOT set here. It comes from
      # features.forceFailurePolicyIgnore.enabled in helm/kyverno-values.yaml,
      # and is changed only by scripts/set-failure-policy.sh.
      #
      # This step used to patch the mutating webhook configurations to
      # failurePolicy=Ignore on every pipeline run, with a comment claiming the
      # Helm value was not respected. The Helm value is respected — it is a
      # controller feature flag, not a chart-rendered field, so it takes effect
      # when Kyverno next writes its webhooks rather than at template time. The
      # patch was therefore redundant, and worse: it would have reverted the
      # cluster to fail-open in the middle of a fail-closed evaluation, because
      # the pipeline runs on every push to docker/.
      #
      # The state is recorded instead of imposed — see the preflight step below,
      # which writes the observed webhook failure policies into the artefact.

      # --- Smoke test ------------------------------------------------------
      # Resolve the digest from the registry (digest env var may not persist
      # across steps in matrix jobs) and deploy an ephemeral pod to confirm
      # the image pulls and runs correctly on the cluster.

      - name: Smoke test
        run: |
          if [ "${{ matrix.cloud }}" = "aws" ]; then
            DIGEST_REF=$(aws ecr describe-images \
              --repository-name "${REPO}" \
              --region "${{ secrets.AWS_REGION }}" \
              --image-ids imageTag="${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text | xargs -I{} echo "${REGISTRY}/${REPO}@{}")
          else
            _DIG=$(az acr repository show \
              --name "${{ secrets.ACR_LOGIN_SERVER }}" \
              --image "${REPO}:${IMAGE_TAG}" \
              --query digest --output tsv)
            DIGEST_REF="${REGISTRY}/${REPO}@${_DIG}"
          fi
          echo "Image: ${DIGEST_REF}"

          kubectl delete pod smoke-test -n supply-chain-demo --ignore-not-found
          kubectl wait pod/smoke-test -n supply-chain-demo \
            --for=delete --timeout=60s 2>/dev/null || true

          kubectl run smoke-test \
            --image="${DIGEST_REF}" \
            --restart=Never \
            --namespace=supply-chain-demo \
            --command -- sh -c 'echo supply-chain-smoke-ok'

          for i in $(seq 1 30); do
            PHASE=$(kubectl get pod smoke-test -n supply-chain-demo \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "Pending")
            [ "${PHASE}" = "Succeeded" ] && echo "Smoke test passed" && break
            [ "${PHASE}" = "Failed"    ] && kubectl logs smoke-test -n supply-chain-demo && exit 1
            [ "${i}"     = "30"        ] && echo "Timed out waiting for smoke test" && exit 1
            sleep 3
          done

          kubectl delete pod smoke-test -n supply-chain-demo --ignore-not-found

      # --- Apply Kyverno policies ------------------------------------------
      # Policies are written once and stored in policies/. The registry URL
      # (REGISTRY_PLACEHOLDER) is substituted at apply time from the per-cloud
      # values file. This is what makes the policies cloud-agnostic.

      - name: Apply Kyverno policies
        run: |
          # Wait for CRDs in case Kyverno was just installed
          for i in $(seq 1 30); do
            kubectl get crd clusterpolicies.kyverno.io >/dev/null 2>&1 && break
            [ "${i}" = "30" ] && echo "Kyverno CRDs not ready" && exit 1
            sleep 10
          done

          kubectl rollout status deployment/kyverno-admission-controller \
            -n kyverno --timeout=120s
          sleep 10

          REGISTRY_VAL=$(grep '^REGISTRY=' policies/values/${{ matrix.cloud }}.env \
            | cut -d= -f2)

          mkdir -p /tmp/kyverno-rendered
          for f in policies/verify-*.yaml; do
            sed "s|REGISTRY_PLACEHOLDER|${REGISTRY_VAL}|g" "$f" \
              > "/tmp/kyverno-rendered/$(basename $f)"
          done

          kubectl apply --server-side --force-conflicts -f /tmp/kyverno-rendered/
          kubectl get clusterpolicies -o wide

      # --- Admission tests -------------------------------------------------
      # TC-01 … TC-05 — the source of Table 6.2.
      #
      # Every case records what it actually observed at admission into
      # ${RESULTS_DIR}/<id>.json via scripts/testcase-lib.sh, and the artefact
      # built at the end is assembled from those records. This replaces a
      # hardcoded `echo` block that printed the same five verdicts under
      # `if: always()` regardless of what the cluster did — so the summary
      # agreed with the workflow's intentions rather than with its results.
      #
      # Cases are not chained on each other's success: each runs unless the job
      # was cancelled, so one failure produces four more observations instead of
      # four blanks. The gate is the artefact step, which fails unless every
      # case in the manifest matched its expected outcome.

      - name: Create supply-chain-demo namespace
        run: |
          kubectl create namespace supply-chain-demo \
            --dry-run=client -o yaml | kubectl apply -f -

      # The enforcement state is recorded before any case runs. Without it the
      # results are uninterpretable: "denied" means nothing if the policies were
      # in Audit, and "admitted" means nothing if they were absent.
      - name: Preflight — record the enforcement state
        id: preflight
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS_DIR}"
          POLICIES="verify-image-signature verify-sbom-cyclonedx verify-slsa-provenance"

          # A ClusterPolicy is not ready the instant it is applied — Kyverno has
          # to register its webhooks first. Waiting here rather than asserting
          # immediately is the difference between a flaky suite and one whose
          # failures mean something.
          for _ in $(seq 1 45); do
            OK=1
            for P in ${POLICIES}; do
              [ "$(kubectl get clusterpolicy "$P" \
                    -o jsonpath='{.status.ready}' 2>/dev/null || true)" = "true" ] || OK=0
            done
            [ "${OK}" = "1" ] && break
            sleep 2
          done

          FAIL=0
          POLICY_STATE="{}"
          for P in ${POLICIES}; do
            ACTION=$(kubectl get clusterpolicy "$P" \
              -o jsonpath='{.spec.validationFailureAction}' 2>/dev/null || true)
            READY=$(kubectl get clusterpolicy "$P" \
              -o jsonpath='{.status.ready}' 2>/dev/null || true)
            echo "  ${P}: ${ACTION:-MISSING} ready=${READY:-unknown}"
            [ "${ACTION:-MISSING}" = "Enforce" ] && [ "${READY:-}" = "true" ] || FAIL=1
            POLICY_STATE=$(jq -n \
              --argjson acc "${POLICY_STATE}" --arg p "$P" \
              --arg a "${ACTION:-MISSING}" --arg r "${READY:-unknown}" \
              '$acc + {($p): {validationFailureAction: $a, ready: $r}}')
          done

          jq -n \
            --arg context "$(kubectl config current-context 2>/dev/null || echo unknown)" \
            --arg kyverno_image "$(kubectl get deployment kyverno-admission-controller \
              -n kyverno -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo unknown)" \
            --arg replicas "$(kubectl get deployment kyverno-admission-controller \
              -n kyverno -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo unknown)" \
            --arg default_ns_label "$(kubectl get namespace default \
              -o jsonpath='{.metadata.labels.kyverno\.io/exclude}' 2>/dev/null || echo '')" \
            --argjson policies "${POLICY_STATE}" \
            --argjson admission "$(bash scripts/webhook-state.sh)" \
            '{kubectl_context: $context, kyverno_image: $kyverno_image,
              kyverno_ready_replicas: $replicas,
              default_namespace_exclude_label: $default_ns_label,
              admission: $admission,
              policies: $policies}' \
            > "${RESULTS_DIR}/_preflight.json"

          echo "  admission configuration: $(jq -r '.admission.configuration' \
            "${RESULTS_DIR}/_preflight.json")"

          if [ "${FAIL}" = "1" ]; then
            echo "ERROR: the admission tests require all three policies present, ready and in Enforce."
            exit 1
          fi

      - name: "TC-01 — compliant pipeline image must be ADMITTED"
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        run: |
          set -euo pipefail
          source scripts/testcase-lib.sh

          # Resolved from the registry rather than carried in an env var: the
          # registry's view is the one Kyverno resolves at admission.
          if [ "${CLOUD}" = "aws" ]; then
            DIGEST_REF=$(aws ecr describe-images \
              --repository-name "${REPO}" \
              --region "${{ secrets.AWS_REGION }}" \
              --image-ids imageTag="${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text | xargs -I{} echo "${REGISTRY}/${REPO}@{}")
          else
            _DIG=$(az acr repository show \
              --name "${{ secrets.ACR_LOGIN_SERVER }}" \
              --image "${REPO}:${IMAGE_TAG}" \
              --query digest --output tsv)
            DIGEST_REF="${REGISTRY}/${REPO}@${_DIG}"
          fi

          probe tc-01 supply-chain-demo "${DIGEST_REF}"
          record_result TC-01 "${PROBE_OUTCOME}" "${DIGEST_REF}" "${PROBE_MESSAGE}" \
            "signed, SBOM-attested and provenance-attested by this run; pod phase ${PROBE_PHASE:-n/a}"

      - name: "TC-02 — nginx from docker.io must be DENIED"
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        run: |
          set -euo pipefail
          source scripts/testcase-lib.sh

          probe tc-02 supply-chain-demo "nginx:latest"
          record_result TC-02 "${PROBE_OUTCOME}" "nginx:latest" "${PROBE_MESSAGE}" \
            "public image, unapproved registry"

      - name: "TC-03 — alpine from docker.io must be DENIED"
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        run: |
          set -euo pipefail
          source scripts/testcase-lib.sh

          probe tc-03 supply-chain-demo "alpine:latest"
          record_result TC-03 "${PROBE_OUTCOME}" "alpine:latest" "${PROBE_MESSAGE}" \
            "public image, unapproved registry"

      - name: "TC-04 — unsigned image in the approved registry must be DENIED"
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        run: |
          set -euo pipefail
          source scripts/testcase-lib.sh

          # Approved registry, no signature: proves registry origin alone is not
          # sufficient for admission.
          TC04_TAG="tc04-unsigned-${{ github.run_id }}"
          TC04_IMAGE="${REGISTRY}/${REPO}:${TC04_TAG}"

          docker build --tag "${TC04_IMAGE}" docker/hello-world
          if ! DIGEST=$(push_and_digest "${TC04_IMAGE}"); then
            abort_scenario TC-04 "${TC04_IMAGE}" "could not push the unsigned image"
          fi
          TC04_REF="${REGISTRY}/${REPO}@${DIGEST}"
          echo "${TC04_REF}" > /tmp/tc04-ref.txt

          # Deployed by digest so the case cannot be satisfied by a tag that
          # happens to resolve elsewhere.
          probe tc-04 supply-chain-demo "${TC04_REF}"
          record_result TC-04 "${PROBE_OUTCOME}" "${TC04_REF}" "${PROBE_MESSAGE}" \
            "pushed to the approved registry without signing"

      - name: "TC-05 — the same unsigned image must be ADMITTED in default"
        if: ${{ !cancelled() && steps.preflight.conclusion == 'success' }}
        run: |
          set -euo pipefail
          source scripts/testcase-lib.sh

          # Re-uses TC-04's exact image reference, so the only variable between
          # the two cases is the namespace. Reading it from the file TC-04 wrote
          # rather than rebuilding the reference is what makes that guarantee
          # hold: a rebuild could produce a different digest.
          if [ ! -f /tmp/tc04-ref.txt ]; then
            abort_scenario TC-05 "n/a" "TC-04 did not publish an image reference"
          fi
          TC04_REF="$(cat /tmp/tc04-ref.txt)"

          probe tc-05-scope default "${TC04_REF}"
          record_result TC-05 "${PROBE_OUTCOME}" "${TC04_REF}" "${PROBE_MESSAGE}" \
            "identical image to TC-04; only the namespace differs; pod phase ${PROBE_PHASE:-n/a}"

      # --- Evidence ----------------------------------------------------------

      - name: Build the admission-test artefact
        if: always()
        run: |
          CLOUD="${CLOUD}" RESULTS_DIR="${RESULTS_DIR}" \
            bash scripts/testcase-summary.sh

      - name: Upload the admission-test artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testcase-results-${{ matrix.cloud }}
          path: |
            testcase-results-*.json
            testcase-results-*.csv
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup probe pods
        if: always()
        run: |
          kubectl delete pod tc-01 tc-02 tc-03 tc-04 \
            -n supply-chain-demo --ignore-not-found --wait=false 2>/dev/null || true
          kubectl delete pod tc-05-scope \
            -n default --ignore-not-found --wait=false 2>/dev/null || true
